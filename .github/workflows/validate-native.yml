name: Validate Elsepin (no IPA)
on:
  workflow_dispatch:
    inputs:
      ui_focus:
        description: Run all validation, or a focused simulator recheck
        type: choice
        options: [all, search, home, pins, routes, route-search, route-identity, review-fixes, backups, imports, import-text, phone-recheck, route-text, everyday, cellular-stop, map-feedback, route-history-backup, pace-and-signals, design-review, single]
        default: all
      ui_test:
        description: For single, use Class/testMethod from Validation/UITests
        type: string
        default: ''
      validate_device:
        description: Also run full regressions and compile the device app for a focused UI run
        type: boolean
        default: false
      simulator_runner:
        description: Simulator toolchain (production compilation always uses Xcode 27)
        type: choice
        options: [xcode-27, macos-26]
        default: xcode-27
      simulator_runtime:
        description: Optional installed iOS version for a focused runtime comparison (for example 27.1)
        type: string
        default: ''
  push:
    branches: [codex/pins-search-69]
    paths:
      - 'Locus/**'
      - 'LocusActivity/**'
      - 'Companion/**'
      - 'CloudFindMy/**'
      - 'Shared/**'
      - 'Tests/**'
      - 'Validation/**'
      - 'scripts/*validation*'
      - 'project.yml'
      - '.github/workflows/validate-native.yml'
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: |
          pip install -r Companion/requirements.txt -r CloudFindMy/requirements.txt
      - name: Run Companion and CloudFindMy unit tests
        run: |
          python3 -m unittest discover -s Companion -p "test_*.py" -v
          python3 -m unittest discover -s CloudFindMy -p "test_*.py" -v
  regression-device:
    if: github.event_name != 'workflow_dispatch' || inputs.ui_focus == 'all' || inputs.validate_device
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and native dependencies
        run: |
          xcodebuild -version
          brew install xcodegen xcbeautify
          mkdir -p .build/validation-evidence
          file Vendor/idevice/libidevice_ffi.a | tee .build/validation-evidence/vendor-library.txt
      - name: Resource and regression checks
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_app_identity.py
          python3 scripts/check_appearance.py
          python3 scripts/package_helpers.py --check
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee .build/validation-evidence/resource-tests.log
          swift test 2>&1 | tee .build/validation-evidence/swift-tests.log
      - name: Compile production app and extension without packaging
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Locus.xcodeproj -scheme Locus -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath .build/device-validation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build \
            2>&1 | tee .build/validation-evidence/device-build.log | xcbeautify
          test -d .build/device-validation/Build/Products/Release-iphoneos/Locus.app/PlugIns/LocusActivity.appex
          if strings .build/device-validation/Build/Products/Release-iphoneos/Locus.app/Locus | grep -F 'SIMULATOR TEST DATA'; then
            echo 'Test-only fixture leaked into production binary'; exit 1
          fi
          test -z "$(find . -name '*.ipa' -print -quit)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-validation-evidence
          path: .build/validation-evidence
          retention-days: 7
  simulator:
    runs-on: ${{ inputs.simulator_runner || 'xcode-27' }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((!inputs.ui_focus || inputs.ui_focus == 'all') && '["flows","other"]' || '["focused"]') }}
    # Both full suites exercise slow first boots and can include XCTest retries.
    timeout-minutes: ${{ matrix.suite == 'focused' && 55 || 90 }}
    steps:
      - uses: actions/checkout@v4
      - name: Portable Swift regressions
        run: swift test
      - name: Prepare isolated simulator project
        env:
          VALIDATION_RUNTIME_VERSION: ${{ inputs.simulator_runtime }}
        run: |
          brew install xcodegen xcbeautify
          python3 -m venv .build/validation-venv
          .build/validation-venv/bin/pip install 'PyYAML==6.0.2'
          .build/validation-venv/bin/python scripts/make_validation_project.py
          xcodegen generate --spec project.validation.json
          python3 scripts/prepare_validation_simulator.py
      - name: Compile isolated simulator app and UI tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/simulator-evidence
          xcodebuild -project ElsepinValidation.xcodeproj -scheme Locus -configuration Debug \
            -destination "platform=iOS Simulator,id=$VALIDATION_SIMULATOR" \
            -derivedDataPath .build/simulator-validation \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee .build/simulator-evidence/simulator-build.log | xcbeautify
      - name: Check backup format and import rules
        if: inputs.ui_focus == 'backups'
        run: |
          set -o pipefail
          swift test --filter 'Backup|LibraryMerge|ShiftAppearanceTests' 2>&1 | tee .build/simulator-evidence/backup-rules.log
      - name: Verify disposable simulator startup
        timeout-minutes: 15
        run: |
          python3 -c 'import os, subprocess; subprocess.run(["xcrun", "simctl", "boot", os.environ["VALIDATION_SIMULATOR"]], check=True, timeout=180)'
          python3 -c 'import os, subprocess; subprocess.run(["xcrun", "simctl", "bootstatus", os.environ["VALIDATION_SIMULATOR"], "-b"], check=True, timeout=660)'
          # XCTest owns display/launch and captures app interaction screenshots.
          # A preliminary SpringBoard image is not an app validation requirement.
      - name: Run focused native UI checks
        shell: bash
        env:
          UI_FOCUS: ${{ inputs.ui_focus }}
          UI_TEST: ${{ inputs.ui_test }}
          SIMULATOR_SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          test_selection=()
          if [[ "$SIMULATOR_SUITE" == flows ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests")
          elif [[ "$SIMULATOR_SUITE" == other ]]; then
            test_selection+=("-skip-testing:LocusValidationUITests/ElsepinFlowUITests")
          elif [[ "$UI_FOCUS" == pace-and-signals ]]; then
            for method in testConfirmedRoutePlaybackTracksSelectedPaceAndResume testRouteRestartsMovementClockAfterTimedStop testTrafficSignalStopCancelsAndPersistsAfterReopening testJoystickUsesUsualSpeedsBetweenEditsAndRestarts testMovingPauseResumeAndStop testSavedRouteStartsFromPreviewAndReconnectsPaused testSavedLegModeAndCustomSpeedsSurviveReopening; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$method")
            done
          elif [[ "$UI_FOCUS" == route-history-backup ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinBackupUITests/testNativeGPXImportSizesSaveAndReopen")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinBackupUITests/testSettingsExportFileSelectiveImportAndRelaunch")
          elif [[ "$UI_FOCUS" == design-review ]]; then
            for method in testRouteSearchCoversStartMiddleAndDestination testRouteCameraStartsAtTheRouteAndRestoresDetailAfterFit testDarkAccessibilityFallbackPaused testResetReviewShowsLossAndRetentionBeforeConfirming testDroppedPinAddressSpacingAtStandardTextSize testDroppedPinAddressSpacingAtLargestTextSize; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$method")
            done
            for method in testSolidTabsLeaveSettingsAndPastedBackupReviewReachable testSettingsExportFileSelectiveImportAndRelaunch; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinBackupUITests/$method")
            done
          elif [[ "$UI_FOCUS" == map-feedback ]]; then
            for method in testDroppedPinAddressSpacingAtStandardTextSize testDroppedPinAddressSpacingAtLargestTextSize testRouteSearchCoversStartMiddleAndDestination; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$method")
            done
          elif [[ "$UI_FOCUS" == cellular-stop ]]; then
            for method in testCellularStopFromMovingRouteKeepsThenClearsSession testCellularStopFromHeldPinKeepsThenClearsSession testCellularStopConfirmationDoesNotFollowReplacementRoute testMovingPauseResumeAndStop testFailedStateOffersRecovery; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$method")
            done
          elif [[ "$UI_FOCUS" == everyday ]]; then
            for method in testDrawnRouteAndCustomLegSurviveRelaunch testFirstLaunchCanDeferSetupAndSaveASearchedPin testFirstLaunchCanDeferSetupAndSaveASearchedPinAtLargestText testSavedRouteStartsFromPreviewAndReconnectsPaused; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$method")
            done
          elif [[ "$UI_FOCUS" == single ]]; then
            if [[ ! "$UI_TEST" =~ ^(Elsepin(Flow|Backup|Import)UITests)/(test[A-Za-z0-9_]+)$ ]]; then
              echo "Choose an Elsepin UI test as Class/testMethod"; exit 1
            fi
            test_file="Validation/UITests/${BASH_REMATCH[1]}.swift"
            method="${BASH_REMATCH[3]}"
            grep -Eq "func[[:space:]]+${method}[(]" "$test_file" || { echo "Unknown test method"; exit 1; }
            test_selection+=("-only-testing:LocusValidationUITests/$UI_TEST")
          elif [[ "$UI_FOCUS" == route-text ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testInlineLegPathChoiceResetsAndBackDiscardsAtLargestText")
          elif [[ "$UI_FOCUS" == phone-recheck ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testSelectedCustomPinRefreshesItsSavedAndRecentAddresses")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinBackupUITests/testSettingsExportFileSelectiveImportAndRelaunch")
          elif [[ "$UI_FOCUS" == search ]]; then
            for test_name in testSearchSubmitFailureAndRetry testSearchCancellationRejectsLateResults testSearchDismissalAndForegroundInterruption testSearchInterruptedWhilePendingThenReplaced; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$test_name")
            done
          elif [[ "$UI_FOCUS" == home ]]; then
            for test_name in testIdleTraySitsAboveSolidNavigation testIdleTraySitsAboveGlassNavigation; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$test_name")
            done
          elif [[ "$UI_FOCUS" == pins ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testSavedPinsCrossCutoffDuringPinchAndStayVisibleWhenRotated")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testDeletedSelectionAfterLongListScroll")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testSavedPinLowerEdgeHoldOnlyMovesPreview")
          elif [[ "$UI_FOCUS" == routes ]]; then
            for test_name in testUsualSpeedsApplyToNewRoutesAndPersist testSavedLegModeAndCustomSpeedsSurviveReopening testInlineLegPathChoiceResetsAndBackDiscardsAtLargestText testInlineNewLegDirectionsRecalculatesOnceAndPreservesSavedStops testMixedLegUsesIncomingSettingsAndUnchangedDonePreservesSections testRecalculateSavedRouteRetainsStopsAndSavesNewSpeed; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$test_name")
            done
          elif [[ "$UI_FOCUS" == route-search ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testRouteSearchCoversStartMiddleAndDestination")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testRouteSearchSeparatesAddStopFromSavePin")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/testRouteSearchDismissesAddStopAfterRouteReplacement")
          elif [[ "$UI_FOCUS" == route-identity ]]; then
            for test_name in testRouteSearchUpdatesSavedIdentityAndMetadata testRouteSearchUpdatesSavedIdentityAtLibraryLimit testRouteSearchSavesUnsavedRouteAsOneNewTrip testRouteSearchSeparatesAddStopFromSavePin; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$test_name")
            done
          elif [[ "$UI_FOCUS" == review-fixes ]]; then
            for test_name in testRouteSearchSeparatesAddStopFromSavePin testRouteSearchDismissesAddStopAfterRouteReplacement testRouteSearchUpdatesSavedIdentityAndMetadata testRouteSearchUpdatesSavedIdentityAtLibraryLimit testRouteSearchSavesUnsavedRouteAsOneNewTrip; do
              test_selection+=("-only-testing:LocusValidationUITests/ElsepinFlowUITests/$test_name")
            done
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinBackupUITests")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinImportUITests/testSavedPlaceRecoveryPreviewsAndRestoresValidatedCopy")
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinImportUITests/testRecoveryLimitsRetainExportableOriginals")
          elif [[ "$UI_FOCUS" == backups ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinBackupUITests")
          elif [[ "$UI_FOCUS" == imports ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinImportUITests")
          elif [[ "$UI_FOCUS" == import-text ]]; then
            test_selection+=("-only-testing:LocusValidationUITests/ElsepinImportUITests/testNarrowLargeTextDarkImportControlsRemainReachable")
          fi
          python3 -c 'import os, subprocess; subprocess.run(["xcrun", "simctl", "install", os.environ["VALIDATION_SIMULATOR"], ".build/simulator-validation/Build/Products/Debug-iphonesimulator/ElsepinValidation.app"], check=True, timeout=180)'
          xcrun simctl privacy "$VALIDATION_SIMULATOR" grant location-always com.n3mostudio.elsepin.validation
          if [[ "$SIMULATOR_SUITE" == other || "$UI_FOCUS" == backups || "$UI_FOCUS" == route-history-backup || "$UI_FOCUS" == review-fixes || "$UI_FOCUS" == phone-recheck || "$UI_FOCUS" == design-review || ( "$UI_FOCUS" == single && "$UI_TEST" == ElsepinBackupUITests/* ) ]]; then
            # Register Files' local provider before interacting with document UI.
            python3 - <<'PY'
          import os, pathlib, subprocess
          evidence = pathlib.Path('.build/simulator-evidence')
          with (evidence / 'files-warmup.log').open('w') as log:
              for args in [['launch', os.environ['VALIDATION_SIMULATOR'], 'com.apple.DocumentsApp'],
                           ['get_app_container', os.environ['VALIDATION_SIMULATOR'], 'com.apple.DocumentsApp', 'groups']]:
                  try:
                      subprocess.run(['xcrun', 'simctl', *args], stdout=log, stderr=log, timeout=90)
                  except subprocess.TimeoutExpired:
                      log.write('Files warmup timed out; retaining diagnostics.\n')
          PY
            python3 scripts/stage_validation_backup.py > .build/simulator-evidence/files-export-observer.log 2>&1 &
            observer_pid=$!
            trap 'kill "$observer_pid" 2>/dev/null || true' EXIT
          fi
          xcodebuild -project ElsepinValidation.xcodeproj -scheme Locus -configuration Debug \
            -destination "platform=iOS Simulator,id=$VALIDATION_SIMULATOR" \
            -derivedDataPath .build/simulator-validation -resultBundlePath .build/simulator-evidence/UI.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -retry-tests-on-failure -test-iterations 2 \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 \
            "${test_selection[@]}" CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee .build/simulator-evidence/ui-tests.log | xcbeautify
      - name: Export screenshots and test results
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          if test -f .build/simulator-evidence/UI.xcresult/Info.plist; then
            xcrun xcresulttool export attachments --path .build/simulator-evidence/UI.xcresult --output-path .build/simulator-evidence/attachments
            xcrun xcresulttool get test-results summary --path .build/simulator-evidence/UI.xcresult > .build/simulator-evidence/summary.json
            xcrun xcresulttool get object --legacy --format json --path .build/simulator-evidence/UI.xcresult > .build/simulator-evidence/result-detail.json
          fi
          if test -n "${VALIDATION_SIMULATOR:-}"; then
            python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          evidence = pathlib.Path('.build/simulator-evidence')
          with (evidence / 'simulator-errors.log').open('w') as log:
              try:
                  subprocess.run(['xcrun', 'simctl', 'spawn', os.environ['VALIDATION_SIMULATOR'], 'log', 'show', '--last', '20m', '--style', 'compact', '--predicate', '(process == "ElsepinValidation" OR process == "SpringBoard" OR process CONTAINS[c] "fileprovider" OR process CONTAINS[c] "documentmanager") AND messageType == error'], stdout=log, stderr=log, timeout=45)
              except subprocess.TimeoutExpired:
                  log.write('Simulator log collection timed out.\n')
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          for report in reports.glob('*'):
              if report.is_file() and any(name in report.name for name in ['Elsepin', 'LocusValidation', 'Simulator']):
                  shutil.copy2(report, evidence / report.name)
          try:
              container = subprocess.check_output(['xcrun', 'simctl', 'get_app_container', os.environ['VALIDATION_SIMULATOR'], 'com.n3mostudio.elsepin.validation', 'data'], text=True, timeout=15).strip()
              for index, file in enumerate((pathlib.Path(container) / 'Documents').rglob('Elsepin-Settings*.json')):
                  shutil.copy2(file, evidence / f'disposable-settings-export-{index}.json')
          except (subprocess.SubprocessError, OSError) as error:
              print(f'Disposable export collection unavailable: {error}')
          PY
            python3 - <<'PY'
          import os, subprocess
          for action in ['shutdown', 'delete']:
              try:
                  subprocess.run(['xcrun', 'simctl', action, os.environ['VALIDATION_SIMULATOR']], check=True, timeout=30)
              except subprocess.SubprocessError as error:
                  print(f'Disposable simulator {action} unavailable: {error}')
          PY
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.suite == 'other' && 'simulator-document-evidence' || 'simulator-validation-evidence' }}
          path: |
            .build/simulator-evidence
            !.build/simulator-evidence/UI.xcresult/**
          retention-days: 7
